<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新签达成 · 全链路盯盘看板</title>
<style>
:root{
  --bg:#f5f7fa; --card:#ffffff; --ink:#0f172a; --sub:#64748b; --line:#e2e8f0;
  --blue:#2563eb; --teal:#0f766e; --red:#b91c1c; --orange:#c2410c; --purple:#6d28d9;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;padding:22px 26px 40px}
.header{max-width:1460px;margin:0 auto 18px}
h1{font-size:25px;font-weight:800;letter-spacing:.5px}
.badges{margin-top:8px;display:flex;gap:10px;flex-wrap:wrap}
.badge{background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 14px;font-size:12.5px;color:var(--sub)}
.badge b{color:var(--ink)}
.note{margin-top:8px;font-size:12.5px;color:var(--sub);line-height:1.7}
.note b{color:#334155}
.kpis{max-width:1460px;margin:0 auto 18px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kpi .t{font-size:13px;color:var(--sub);margin-bottom:6px}
.kpi .v{font-size:30px;font-weight:800;line-height:1.1}
.kpi .s{font-size:12px;color:var(--sub);margin-top:5px}
.sec{max-width:1460px;margin:0 auto 20px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
.sec-h .n{font-size:17px;font-weight:800;padding:3px 12px;border-radius:8px;color:#fff}
.sec-h .d{font-size:12.5px;color:var(--sub)}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,.06)}
/* 日维度表冻结列依赖 sticky，必须放开 table 自身的 overflow:hidden（否则 sticky 被限制在表格盒内，横滚后被裁掉，2026-11-10） */
#dailyTable table{overflow:visible;border-radius:0}
th{background:#f1f5f9;font-size:12.5px;color:#475569;font-weight:700;padding:10px 10px;text-align:center;white-space:nowrap;position:sticky;top:0;z-index:2}
td{padding:9px 10px;text-align:center;font-size:13.5px;border-top:1px solid #eef2f7;white-space:nowrap}
td.l{text-align:left}
.city-cell{font-weight:700;font-size:14.5px}
.pill{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12.5px;font-weight:700}
.pill.good{background:#dcfce7;color:#166534}
.pill.mid{background:#fef9c3;color:#854d0e}
.pill.bad{background:#fee2e2;color:#991b1b}
.pill.gray{background:#f1f5f9;color:#475569}
.judge{font-size:12.5px;font-weight:700}
.jj-green{color:#15803d}.jj-red{color:#b91c1c}.jj-orange{color:#c2410c}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.fbtn{border:1px solid var(--line);background:#fff;border-radius:18px;padding:5px 14px;font-size:12.5px;cursor:pointer;color:#334155}
.fbtn.on{background:#2563eb;color:#fff;border-color:#2563eb}
.fcount{font-size:12px;color:var(--sub)}
.search{border:1px solid var(--line);border-radius:18px;padding:5px 14px;font-size:12.5px;width:200px;outline:none}
.twrap{max-height:640px;overflow:auto;border-radius:12px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.tag{display:inline-block;padding:1px 7px;border-radius:8px;font-size:11px;font-weight:700;margin-left:4px;vertical-align:1px}
.tag.zl{background:#f3e8ff;color:#6d28d9}
.tag.cg{background:#e0f2fe;color:#0369a1}
.tag.cm{background:#f5f3ff;color:#7c3aed}
.tag.lk{background:#e0f2fe;color:#0369a1}
.tag.wait{background:#f1f5f9;color:#64748b;font-weight:600}
.footer{max-width:1460px;margin:26px auto 0;font-size:12px;color:#94a3b8;line-height:1.9;border-top:1px solid var(--line);padding-top:12px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}}
/* ===== 手机端适配（2026-11-07）===== */
@media(max-width:768px){
  body{padding:10px 8px 30px;font-size:13px}
  h1{font-size:19px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:8px}
  .card{padding:10px;border-radius:10px}
  table{font-size:12px}
  th,td{padding:4px 6px}
  /* 大表：横向平滑滚动 + 表头/首列吸附 */
  #cityTable,#dailyTable,#rtTable{overflow-x:auto;-webkit-overflow-scrolling:touch}
  #cityTable table,#dailyTable table{min-width:980px}
  #rtTable{min-width:820px}
  #dailyTable th{position:sticky;top:0;z-index:3;background:#f8fafc}
  /* 冻结列依赖 sticky，必须放开 table 自身的 overflow:hidden（否则 sticky 被限制在表格盒内，横滚后被裁掉） */
  #dailyTable table{overflow:visible}
  #dailyTable td:first-child,#dailyTable th:first-child{position:sticky;left:0;z-index:2;background:#f8fafc}
  #dailyTable thead th:first-child{z-index:4}
  .filters{flex-wrap:wrap;gap:6px}
  .badge{display:inline-block;margin:2px 4px 2px 0}
}
</style>
</head>

const DSTAMP = (d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'))(new Date());
function exportTable(sel, name){
  const tb = document.querySelector(sel);
  if(!tb || !tb.querySelector('tr')){ alert('暂无数据可导出'); return; }
  const rows = [...tb.querySelectorAll('tr')].map(tr =>
    [...tr.children].map(c => c.innerText.replace(/\s+/g,' ').trim()));
  const esc = v => '"' + String(v==null?'':v).replace(/"/g,'""') + '"';
  const csv = '\ufeff' + rows.map(r=>r.map(esc).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
}

    `<div class="kpi"><div class="t">${c.t}</div><div class="v ${c.c.startsWith('jj')?c.c:''}" style="${c.c.startsWith('jj')?'font-size:26px':''}">${c.c.startsWith('jj')?c.v:`<span class="pill ${c.c}" style="font-size:26px;padding:4px 16px">${c.v}</span>`}</div><div class="s">${c.s}</div></div>`).join('');
})();

// 城市表 —— 排序：①按城市体量（组合计常规目标）降序；②常德三小城一组，合计行放组内最后
(function(){
  const CD = ['武陵区','鼎城区','津市','常德其他'];
  const grp = c => (c.sum_row || CD.includes(c.c)) ? '常德' : c.c;
  const grpRt = {};
  D.cities.forEach(c=>{ if(!c.sum_row){ const g=grp(c); grpRt[g]=(grpRt[g]||0)+c.rt; } });
  const order = Object.entries(grpRt).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const cs = [...D.cities].sort((a,b)=>{
    const ga=order.indexOf(grp(a)), gb=order.indexOf(grp(b));
    if(ga!==gb) return ga-gb;
    if(a.sum_row) return 1;
    if(b.sum_row) return -1;
    return b.rt-a.rt;   // 组内按常规目标（体量）降序
  });
  const rankMap = {}; D.cities.forEach(c=>{ if(c.rank) rankMap[c.c]=c.rank+' '+c.rank_pct; });
  // 过程项子项单元格：达成率 + 分子/分母 + 距达标差几家
  const procCell = (rate, num, den, need, th) => {
    if(rate==null) return '<span style="color:#94a3b8">—</span>';
    const ok = rate >= th;
    const tail = (need!=null && need>0)
      ? `<b style="color:var(--red)">差 ${need} 家</b>`
      : '<b style="color:#15803d">已达标</b>';
    return `<span class="pill ${ok?'good':'bad'}" style="font-size:12.5px">${pct(rate)}</span>
      <div style="font-size:10.5px;color:var(--sub);margin-top:3px">${num}/${den} 家 · ${tail}</div>`;
  };
  // 权重取分层：TIER_WEIGHTS = (战略, 常规, 养活) —— 索引 0=战略 1=常规 2=养活
  const wOf = (tier, idx) => (tier && D.meta.nov11.weights[tier]) ? Math.round(D.meta.nov11.weights[tier][idx] * 100) : 0;
  let h = `<table><thead><tr>
    <th>城市</th>
    <th>常规得分/目标</th>
    <th>战略得分/目标</th>
    <th>养活达成/目标</th>
    <th>供给份额系数<br><span style="font-weight:400">提升值</span></th>
    <th style="background:#f0fdf4">新签综合完成率<br><span style="font-weight:400">11月主口径</span></th>
    <th>建店未得分商户<br><span style="font-weight:400">常规/战略</span></th>
    <th>天花板<br><span style="font-weight:400">未得分全得分·常1.3/战3</span></th>
    <th>120%还需签约</th>
    <th>建议还需拜访</th>
    </tr></thead><tbody>`;
  for(const c of cs){
    const has = c.cur!=null;
    const judge = !has ? '<span class="judge jj-orange">无新签考核目标</span>'
      : c.fin==null ? '<span class="judge jj-orange">待养活目标</span>'
      : c.fin>=1.2 ? '<span class="judge jj-green">✓ 已达120%</span>'
      : c.fin>=1 ? '<span class="judge jj-green">✓ 已过100%</span>'
      : (c.ceiling!=null && c.ceiling>=1) ? '<span class="judge jj-green">催单可过100%</span>'
      : (c.need_120==null ? '<span class="judge jj-red">120%不可达·受80%封顶</span>'
         : `<span class="judge jj-red">需签约 ${c.need_120} 家</span>`);
    const TC = {'反超':['#0f766e','#f0fdf4'],'对齐':['#1d4ed8','#eff6ff'],'未上岸':['#b45309','#fffbeb'],'落败':['#b45309','#fffbeb']};
    const tw = c.tier ? (D.meta.nov11.weights[c.tier]||[]).map(w=>Math.round(w*100)).join('/') : '';
    const tierTag = c.tier
      ? `<span class="tag" style="background:${TC[c.tier]?TC[c.tier][1]:'#f1f5f9'};color:${TC[c.tier]?TC[c.tier][0]:'#475569'};border:1px solid ${TC[c.tier]?TC[c.tier][0]:'#cbd5e1'};font-weight:800;font-size:11px">${c.tier}</span>`
      : '';
    const nameCell = c.sum_row
      ? `<span style="color:var(--purple);font-weight:800">常德 · 三区合计</span><div style="font-size:10.5px;color:var(--sub);margin-top:2px">武陵区＋鼎城区＋津市</div>`
      : `<b>${c.c}</b><div style="margin-top:3px">${tierTag}${tw?`<span style="font-size:10px;color:var(--sub);margin-left:4px">${tw}</span>`:''}</div>`;
    const b = v => c.sum_row ? `<span style="color:var(--purple);font-weight:800">${v}</span>` : v;
    const rowBg = c.sum_row ? 'style="background:#faf5ff"' : '';
    const wrW = wOf(c.tier, 1);
    const rtCell = c.rt
      ? `<b style="font-size:14px">${c.ra.toFixed(1)}/${c.rt.toFixed(1)}</b>
         <div style="font-size:10px;color:var(--sub);margin-top:2px">达成率 ${pct(c.ra/c.rt)}</div>`
      : '—';
    const wsW = wOf(c.tier, 0);
    const stCell = c.st
      ? `<b style="font-size:14px">${c.sa.toFixed(1)}/${c.st.toFixed(1)}</b>
         <div style="font-size:10px;color:var(--sub);margin-top:2px">达成率 ${pct(c.sa/c.st)}</div>`
      : '—';
    const wyW = wOf(c.tier, 2);
    const yc = c.yh_calc;
    const yhCell = (yc && (yc.a > 0 || yc.t > 0))
      ? `<b style="font-size:14px;color:#0f766e">${(yc.a||0).toFixed(1)}/${(yc.t||0).toFixed(1)} 分</b>
         <div style="font-size:10px;color:var(--sub);margin-top:2px">达成率 ${yc.t>0?pct(yc.a/yc.t):'—'} · 目标=11月终版</div>`
      : '<span style="color:#94a3b8">—</span>';
    const shareCell = c.share!=null
      ? `<b style="font-size:14px">${c.share.toFixed(3)}</b><div style="font-size:10px;color:var(--sub);margin-top:2px">${c.share_improve||''}</div>`
      : '—';
    const novCell = c.cur_nov!=null
      ? `<span class="pill ${cls(c.cur_nov)}" style="font-weight:800;font-size:15px">${pct(c.cur_nov)}</span>
         <div style="font-size:10px;color:var(--sub);margin-top:3px">${c.rank||''} ${c.rank_pct||''}</div>
         <div style="font-size:10.5px;margin-top:2px">${judge}</div>`
      : (has ? '<span style="color:#94a3b8;font-size:11px">待养活目标</span>' : '—');
    const poolCell = (c.n_r!=null)
      ? `<b style="font-size:13px">常规 ${c.n_r} · 战略 ${c.n_s}</b>
         <div style="font-size:10px;color:var(--sub);margin-top:2px">合计 ${c.n_r+c.n_s} 家</div>`
      : '—';
    const ceilCell = c.ceiling!=null
      ? `<span class="pill ${cls(c.ceiling)}" style="font-weight:800;font-size:14px">${pct(c.ceiling)}</span>`
      : '—';
    const n120 = c.need_120;
    const x120Cell = c.need_blank
      ? ''   // 🔴 天花板已 ≥120% → 该列留空白（用户 2026-11-07 定版）
      : (n120==null
      ? `<span style="color:#b91c1c;font-weight:700;font-size:12px">不可达</span><div style="font-size:10px;color:var(--sub);margin-top:2px">受 80% 封顶限制</div>`
      : (n120===0 ? `<b style="color:#15803d;font-size:15px">0</b><div style="font-size:10px;color:#15803d;margin-top:2px">已可达120%</div>`
         : `<b style="color:var(--red);font-size:15px">常规 ${c.need_120_r} · 战略 ${c.need_120_s}</b> 家<div style="font-size:10px;color:var(--sub);margin-top:2px">合计 ${n120} 家 · 两项同步达 ${c.need_rate??'—'}% · 剩 ${c.remain_days} 天 · 每天建店 ${c.per_day} 家</div>`));
    const v120Cell = c.need_blank
      ? ''
      : (n120==null
      ? '—'
      : (n120===0 ? '0' : `<b style="font-size:14px">${c.visits_120}</b> 家<div style="font-size:10px;color:var(--sub);margin-top:2px">剩 ${c.remain_days} 天 · 每天拜访约 ${Math.ceil(c.visits_120/(c.remain_days||15))} 家</div>`));
    h += `<tr ${rowBg}>
      <td class="l city-cell">${nameCell}</td>
      <td>${b(rtCell)}</td>
      <td>${b(stCell)}</td>
      <td>${b(yhCell)}</td>
      <td>${b(shareCell)}</td>
      <td>${novCell}</td>
      <td>${b(poolCell)}</td>
      <td>${b(ceilCell)}</td>
      <td>${b(x120Cell)}</td>
      <td>${b(v120Cell)}</td></tr>`;
  }
  h += '</tbody></table>';
  document.getElementById('cityTable').innerHTML = h;
})();

// 实时明细
(function(){
  const m = D.meta;
  const rows = D.rows;
  const statuses = [...new Set(rows.map(r=>r.status))];
  // 城市筛选按钮：按组顺序（体量降序，常德三区相邻）
  const CD = ['武陵区','鼎城区','津市','常德其他'];
  const grpRt = {};
  D.cities.forEach(c=>{ if(!c.sum_row){ const g=CD.includes(c.c)?'常德':c.c; grpRt[g]=(grpRt[g]||0)+c.rt; } });
  const cityOrder = Object.entries(grpRt).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const bigOf = c => CD.includes(c)?'常德':c;
  const bigSeq = [...new Set(rows.map(r=>bigOf(r.c)))].sort((a,b)=>cityOrder.indexOf(a)-cityOrder.indexOf(b));
  const cities = [];
  bigSeq.forEach(g=>{
    cities.push(g);
    if(g==='常德'){
      [...new Set(rows.filter(r=>CD.includes(r.c)).map(r=>r.c))]
        .sort((a,b)=>CD.indexOf(a)-CD.indexOf(b))
        .forEach(c=>cities.push(c));
    }
  });
  let fCity='全部', fStatus='全部', kw='';
  const fl = document.getElementById('filters');
  fl.innerHTML = `<span class="fcount">筛选：</span>` +
    ['全部',...cities].map(c=>`<button class="fbtn ${c==='全部'?'on':''}" data-k="city" data-v="${c}">${c}</button>`).join('') +
    `<span class="fcount" style="margin-left:10px">状态：</span>` +
    ['全部',...statuses].map(s=>`<button class="fbtn ${s==='全部'?'on':''}" data-k="status" data-v="${s}">${s}</button>`).join('') +
    `<input class="search" id="kw" placeholder="搜店名 / 商户ID / BD">` +
    `<span class="fcount" id="fcount"></span>` +
    `<button id="btnExportD" style="${BTN_EXP}">⬇ 导出明细</button>`;
  document.getElementById('btnExportD').addEventListener('click', ()=>
    exportTable('#rtTable', `建店未得分商户明细_${DSTAMP}.csv`));
  document.getElementById('rtSub').textContent = SNAP
    ? `${rows.length} 家建店未得分商户 · 筛选：餐饮考核商户=1 + 考核窗口内（考核剩余天数≥0）+ 绩效已记录=1 + 本月得分=0 · 全部取自 ${m.score_ds.slice(0,4)}-${m.score_ds.slice(4,6)}-${m.score_ds.slice(6,8)} 新签商户明细（单量＝30天>5元风控后订单、营业时长＝30天累计），未叠加盯盘实时 · 得分标准：30天内笔单价>5元订单≥7单+42H，本月不考核过程项系数`
    : `${rows.length} 家建店未得分商户 · 今日有效订单实时取自轩辕后台 · 单量口径=${m.score_ds.slice(4,6)}-${m.score_ds.slice(6,8)}快照+今日实时（无缝衔接）· 营业时长：截止昨日快照累计 + 今日商家端「营业时间设置」计划时长，预计累计＞42H 即本月时长达标（休息中只要时段没走完照算）`;
  document.querySelector('#rtTable thead').innerHTML = SNAP ? `<tr>
    <th>城市</th><th>BDM</th><th>BD</th><th class="l">商户名称</th><th>商户ID</th><th>类型</th>    <th>本月得分<br><span style="font-weight:400">副行=上月得分</span></th>
    <th>新签养活<br><span style="font-weight:400">是否达标</span></th>
    <th>累计单量<br><span style="font-weight:400">明细·30天&gt;5元</span></th><th>还差单</th><th>养活还差单<br><span style="font-weight:400">养活目标−累计</span></th>
    <th>累计营业时长<br><span style="font-weight:400">明细·30天H</span></th><th>还差H</th>
    <th>剩余天数</th><th>状态</th></tr>` : `<tr>
    <th>城市</th><th>BDM</th><th>BD</th><th class="l">商户名称</th><th>商户ID</th><th>类型</th>    <th>本月得分<br><span style="font-weight:400">副行=上月得分</span></th>
    <th>新签养活<br><span style="font-weight:400">是否达标</span></th>
    <th>截止昨日订单量<br><span style="font-weight:400">快照累计</span></th><th>还差单<br><span style="font-weight:400">按实时预估</span></th><th>养活还差单<br><span style="font-weight:400">养活目标−累计</span></th>
    <th>截止昨日累计营业时长<br><span style="font-weight:400">快照H</span></th><th>今日计划营业H<br><span style="font-weight:400">商家端实测</span></th>
    <th>预计累计营业H<br><span style="font-weight:400">昨日+今日计划</span></th><th>还差H</th>
    <th>剩余天数</th><th>状态</th></tr>`;
  const tb = document.querySelector('#rtTable tbody');
  // 状态汇总条
  (function(){
    const order = SNAP ? ['yhdelta','yhwait','hours','ords','zero','offline','tmr']
                       : ['tmr','hours','today','zero','offline','notfound','pending'];
    const meta = SNAP
      ? {yhdelta:['已养活·待补差分','#15803d'],
         yhwait:['已达标·待养活','#0f766e'],
         hours:['单够·只差营业时长','#c2410c'], ords:['时长够·只差单量','#0369a1'],
         zero:['单量时长双缺','#475569'], offline:['门店已下线','#b91c1c'],
         tmr:['已达标·待记分','#15803d']}
      : {tmr:['今晚达标→明日得分','#15803d'], today:['今日已出单','#0f766e'],
         hours:['单够·营业时长不足','#c2410c'], zero:['今日0单','#475569'],
         offline:['门店已下线','#b91c1c'],
         notfound:['后台查无此商户','#b91c1c'], pending:['未检测·待跑','#94a3b8']};
    const cnt = {}; rows.forEach(r=>cnt[r.stype]=(cnt[r.stype]||0)+1);
    document.getElementById('statbar').innerHTML = order.filter(k=>cnt[k]).map(k=>{
      const [label,color] = meta[k];
      return `<span style="background:#fff;border:1px solid ${color}33;border-left:4px solid ${color};border-radius:8px;padding:7px 14px;font-size:12.5px;color:${color}"><b style="font-size:16px">${cnt[k]}</b> 家 · ${label}</span>`;
    }).join('');
  })();
  const STCLS = {yhdelta:'pill good', yhwait:'pill good', tmr:'pill good', today:'pill mid', hours:'pill mid', ords:'pill mid',
                 zero:'pill gray', notfound:'pill bad', offline:'pill bad', pending:'pill gray'};
  // 新签养活标记：是否达到养活标准（日常营业≥6h、月累计达标营业天数≥15天）
  function yhTag(r){
    if(r.yh===1) return '<span class="tag" style="background:#f0fdf4;color:#15803d;border:1px solid #86efac;font-weight:800">✅ 已养活</span>';
    if(r.yh_target>0) return '<span class="tag wait">未养活·待单量</span>';
    return '<span class="tag wait">未达标</span>';
  }
  // 明细排序：与城市筛选按钮同款组顺序
  const grpOf = r => r.big==='常德' ? '常德' : r.c;
  function render(){
    const list = rows.filter(r =>
      (fCity==='全部'||r.c===fCity) && (fStatus==='全部'||r.status===fStatus) &&
      (!kw || r.n.includes(kw) || r.id.includes(kw) || (r.bd||'').includes(kw)));
    list.sort((a,b)=>{
      const ga=cityOrder.indexOf(grpOf(a)), gb=cityOrder.indexOf(grpOf(b));
      if(ga!==gb) return ga-gb;
      if(a.c!==b.c) return a.c.localeCompare(b.c,'zh');
      return (b.today||-1)-(a.today||-1) || a.need_o-b.need_o;
    });
    tb.innerHTML = list.map(r=>{
      const leftCls = r.left_n<=7 ? 'color:var(--red);font-weight:800' : '';

      let planCell, hEndCell;
      const hit42 = (v) => `<b style="color:#15803d;font-size:15px">${v}</b><div style="font-size:10.5px;color:#15803d;font-weight:700">✅ 时长达标</div>`;
      const miss42 = (v) => `<b style="color:var(--orange);font-size:15px">${v}</b><div style="font-size:10.5px;color:var(--orange);font-weight:700">❌ 未达标</div>`;
      if(r.h_src==='rt'){
        planCell = `<b style="font-size:14px">${r.plan_h}H</b>${r.hours_label?`<div style="font-size:10.5px;color:var(--sub)">${r.hours_label}</div>`:''}`;
        hEndCell = (r.h_end>=42?hit42:miss42)(r.h_end) + `<div style="font-size:10.5px;color:var(--sub)">昨日${r.h}＋今日${r.plan_h}H</div>`;
      } else if(r.h_src==='offline'){

      } else if(r.h_src==='noset'){

        hEndCell = miss42(r.h) + `<div style="font-size:10.5px;color:#b91c1c">未设置营业时间</div>`;
      } else {
        planCell = `<span style="color:#94a3b8;font-size:12px">未采集</span>`;
        hEndCell = `<b style="font-size:14px">${r.h}</b><div style="font-size:10.5px;color:#94a3b8">未采集，无法判定</div>`;
      }
      if (SNAP) {

        const yhNeedCell = (r.yh_need_o>0)

          : (r.yh_target>0 ? '<span style="color:#15803d">✓</span>' : '<span style="color:#94a3b8">—</span>');
        return `<tr>
          <td>${r.c}</td><td>${r.bdm||'—'}</td><td>${r.bd||'—'}</td>
          <td class="l">${r.n}</td>
          <td style="font-size:12px;color:var(--sub)">${r.id}</td>
          <td><span class="tag ${r.sx?'zl':'cg'}">${r.sx?'战略':'常规'}</span></td>
          <td style="font-weight:700;color:${r.score>0?'#0f766e':'#94a3b8'}">${r.score||0}<div style="font-size:10px;font-weight:400;color:var(--sub);margin-top:2px">上月 ${(r.prev||0)} 分</div></td>
          <td class="l" style="line-height:1.9">${yhTag(r)}</td>
          <td>${r.cum}</td>
          <td>${r.need_o?`<b style="color:var(--orange)">${r.need_o}</b>`:'<span style="color:#15803d">✓</span>'}</td>
          <td>${yhNeedCell}</td>
          <td>${r.h}</td>
          <td>${okH?'<span style="color:#15803d">✓</span>':`<b style="color:var(--orange)">${r.need_h}</b>`}</td>
          <td style="${leftCls}">${r.left}</td>
          <td><span class="pill ${stc}" style="font-size:11.5px">${r.status}</span></td></tr>`;
      }
      return `<tr>
        <td>${r.c}</td><td>${r.bdm||'—'}</td><td>${r.bd||'—'}</td>
        <td class="l">${r.n}</td>

// 得分 · 建店 日维度（城市 / BDM / BD）—— 表头与「城市达成·预测·倒推」板块一致
(function(){
  const m = D.meta, DL = m.daily;
  if(!DL || !DL.cities || !Object.keys(DL.cities).length){
    document.getElementById('dailySub').textContent = '日维度数据缺失';
    return;
  }
  const N18 = m.node18 || 18;
  const days = DL.days.slice().sort((a,b)=>b-a);          // 日期列倒序：新→旧
  const month = DL.month || '';
  const mm = month.slice(4,6), yy = month.slice(0,4);
  let mode = 'b';   // b=建店 s=得分
  let fCity = '全部', fBdm = '全部', fBd = '全部';
  const CD = ['武陵区','鼎城区','津市','常德其他'];
  const cityNames = Object.keys(DL.cities).sort((a,b)=>{
    const ga = CD.includes(a)?1:0, gb = CD.includes(b)?1:0;
    if(ga!==gb) return ga-gb;
    return (DL.cities[b].tot.b||0)-(DL.cities[a].tot.b||0);
  });
  const cityRow = cn => (D.cities||[]).find(x=>x.c===cn && !x.sum_row) || (D.cities||[]).find(x=>x.c===cn) || {};
  const WT = tier => (tier && m.nov11.weights[tier]) ? m.nov11.weights[tier] : [0.5,0.3,0.2];
  // 11月加权达成率（与后端 nov11_rate 同一算法：缺养活项按有效权重归一化、80%兜底封顶、份额后整体上限120%）
  function novRate(ra, rt, sa, st, tier, share){
    const w = WT(tier);
    let r = rt ? ra/rt : null, s = st ? sa/st : null;
    if(r!=null && r<0.8 && s!=null) s = Math.min(s,1);
    if(s!=null && s<0.8 && r!=null) r = Math.min(r,1);
    const it = [];
    if(r!=null) it.push([r, w[1]]);
    if(s!=null) it.push([s, w[0]]);
    if(!it.length) return null;
    const tw = it.reduce((a,x)=>a+x[1],0) || 1;
    return Math.min(it.reduce((a,x)=>a+x[0]*x[1],0)/tw * (share||1), 1.2);
  }
  const pctf = v => (v==null ? '—' : (v*100).toFixed(1)+'%');
  const clsF = v => (v==null ? '' : v>=1 ? 'good' : v>=0.8 ? 'mid' : 'bad');

  const fmt = v => v ? v : '<span style="color:#e2e8f0">·</span>';
  const TG = DL.targets || {};
  function render(){
    let h = `<table style="border-collapse:collapse;width:100%"><thead><tr>
      <th style="position:sticky;left:0;background:#f8fafc">城市</th><th>BDM</th><th class="l">BD</th>
      <th style="background:#ecfdf5">常规得分/目标</th>
      <th style="background:#f5f3ff">战略得分/目标</th>
      <th style="background:#fef3c7">养活达成/目标</th>
      <th>供给份额系数<br><span style="font-weight:400">提升值</span></th>

      <th>建店未得分<br><span style="font-weight:400">常规/战略</span></th>
      <th>天花板<br><span style="font-weight:400">未得分全得分·常1.3/战3</span></th>

      const wtxt = tier && m.nov11.weights[tier] ? m.nov11.weights[tier].map(w=>Math.round(w*100)).join('/') : '';
      const wR = Math.round(WT(tier)[1]*100), wS = Math.round(WT(tier)[0]*100), wY = Math.round(WT(tier)[2]*100);

        if(fBdm!=='全部' && bm!==fBdm) return;
        list.push({lv:'bdm', bm, bd:null, nd:bu.tot, tgt:bu.tgt||{}});
        Object.entries(bu.bds).sort((a,b)=>(b[1].b||0)-(a[1].b||0)).forEach(([bd,nd])=>{
          if(fBd!=='全部' && bd!==fBd) return;
          list.push({lv:'bd', bm, bd, nd, tgt:nd.tgt||{}});});
      });
      for(const R of list){

        const nm = R.lv==='city' ? cn : (R.lv==='bdm' ? R.bm : R.bd);
        const preB = pre.reduce((a,d)=>a+((nd.days[d]||[])[0]||0),0);
        const preS = pre.reduce((a,d)=>a+((nd.days[d]||[])[1]||0),0);
        const postB = post.reduce((a,d)=>a+((nd.days[d]||[])[0]||0),0);
        const postS = post.reduce((a,d)=>a+((nd.days[d]||[])[1]||0),0);
        const ra = tg.ra||0, rt = tg.rt||0, sa = tg.sa||0, st = tg.st||0;
        const nv = novRate(ra, rt, sa, st, tier, share);
        const np = nd.pool;
        const rtCell = rt
          ? `<b style="font-size:13px">${ra.toFixed(1)}/${rt.toFixed(1)}</b>
             <div style="font-size:10px;color:var(--sub);margin-top:1px">达成率 ${pctf(ra/rt)}</div>`
          : '<span style="color:#94a3b8">—</span>';
        const stCell = st
          ? `<b style="font-size:13px">${sa.toFixed(1)}/${st.toFixed(1)}</b>
             <div style="font-size:10px;color:var(--sub);margin-top:1px">达成率 ${pctf(sa/st)}</div>`
          : '<span style="color:#94a3b8">—</span>';
        // 养活达成/目标（2026-11-13 用户定版）：BDM/BD 单独设目标（城市养活目标÷考核餐饮BD数，与常规/战略同口径均分）、
        // 单独计算达成（= 名下商户 Σ养活系数，与城市同口径）；城市行 = 城市级值
        const yhCell = (() => {
          if (R.lv === 'city') {
            const yhS = cr.yh_calc;
            return (yhS && yhS.a > 0)
              ? `<b style="font-size:13px;color:#0f766e">${yhS.a.toFixed(1)}${yhS.t?'/'+yhS.t.toFixed(1)+' 分':''}</b>
                 <div style="font-size:10px;color:var(--sub);margin-top:1px">达成率 ${yhS.t?pctf(yhS.a/yhS.t):'—'} · 目标=11月终版</div>`
              : '<span style="color:#94a3b8">—</span>';

          const ya = (np && np.yh_a) || 0, yt = tg.yt || 0;

             <div style="font-size:10px;color:var(--sub);margin-top:1px">达成率 ${yt?pctf(ya/yt):'—'} · 目标=城市目标÷考核BD数</div>`;
        })();
        const shareCell = `<b style="font-size:13px">${share.toFixed(3)}</b>
             <div style="font-size:10px;color:var(--sub);margin-top:1px">${cr.share_improve||''}</div>`;
        const novCell = nv==null ? '<span style="color:#94a3b8">—</span>'
          : `<span class="pill ${clsF(nv)}" style="font-weight:800;font-size:14px">${pctf(nv)}</span>`;
        const _pn = (R.lv==='city' && cr.n_r!=null) ? {r:cr.n_r, s:cr.n_s}
          : (np ? {r:np.n_r, s:np.n_s} : null);

          : '<span style="color:#cbd5e1">—</span>';
        const nc = R.lv==='city' ? cr : np;
        const ceilCell = nc && nc.ceiling!=null
          ? `<span class="pill ${clsF(nc.ceiling)}" style="font-weight:800;font-size:13px">${pctf(nc.ceiling)}</span>`
          : '<span style="color:#cbd5e1">—</span>';
        const x120Cell = nc==null ? '<span style="color:#cbd5e1">—</span>'
          : (nc.need_blank ? ''   /* 天花板已 ≥120% → 留空白（用户 2026-11-07 定版） */
             : (nc.need_120==null ? '<span style="color:#b91c1c;font-weight:700;font-size:11.5px">不可达</span>'
                : (nc.need_120===0 ? '<b style="color:#15803d">0</b>'
                   : `<b style="color:var(--red);font-size:13px">常规 ${nc.need_120_r||0} · 战略 ${nc.need_120_s||0}</b> 家
                      <div style="font-size:10px;color:var(--sub)">合计 ${nc.need_120} 家 · 两项同步达 ${nc.need_rate??'—'}% · 剩 ${nc.remain_days} 天 · 每天 ${nc.per_day} 家</div>`)));
        const v120Cell = nc==null ? '<span style="color:#cbd5e1">—</span>'
          : (nc.need_blank ? ''
             : (nc.need_120==null ? '—'

                   : `<b style="font-size:13px">${nc.visits_120}</b> 家

        h += `<tr ${bg?`style="${bg}"`:''}>

            ${nd.b?`<div style="font-size:9.5px;color:var(--sub);margin-top:1px">战P0 ${nd.s0||0}·P1 ${nd.s1||0}｜常P0 ${nd.c0||0}·P1 ${nd.c1||0}</div>`:''}</td>
          <td><b style="color:${nd.sr?'#15803d':'#94a3b8'}">${nd.sr}</b> / <b style="color:${nd.ss?'#7c3aed':'#cbd5e1'}">${nd.ss}</b></td>
          <td style="background:#ecfdf5">${preB} / <b style="color:#15803d">${preS}</b></td>
          <td style="background:#fff7ed">${postB} / <b style="color:#c2410c">${postS}</b></td>
          ${days.map(d=>{

            return `<td style="${d===N18?'border-left:2px dashed #b91c1c;':''}${v?'':'color:#e2e8f0'}${mode==='s'&&v?'color:#15803d;font-weight:700;':''}">${fmt(v)}</td>`;

  // 冻结 城市/BDM/BD 前三列（含表头）：横向滚动时固定（用户 2026-11-10 定版）
  function freezeCols(){
    const tb = document.querySelector('#dailyTable table'); if(!tb || !tb.rows.length) return;
    const w = [...tb.rows[0].cells].slice(0,3).map(c=>c.offsetWidth);
    const lefts = [0, w[0], w[0]+w[1]];
    for(const tr of tb.rows){
      if(tr.cells.length < 3) continue;
      [tr.cells[0], tr.cells[1], tr.cells[2]].forEach((c,i)=>{
        c.style.position = 'sticky';
        c.style.left = lefts[i] + 'px';
        c.style.zIndex = 3;

      });

    if(hr){
      [hr.cells[0], hr.cells[1], hr.cells[2]].forEach((c,i)=>{
        c.style.position='sticky'; c.style.left=lefts[i]+'px';

// footer
document.getElementById('footer').innerHTML =
  `<b>口径说明（取数与计算方式）· 11 月版</b><br>
   ① <b>数据源</b>：全部取自 <b>11 月新签商户明细</b>（${D.meta.nov_src||'—'}，数据日 ${D.meta.score_ds}，${D.meta.pool_count} 家建店未得分商户）。<b>不再使用 10 月商户粒度快照</b>。JBP 结果中仍缺的部分（过程项系数 k1/k2 等）留空，出数后补齐。<br>
   ② <b>单店得分（累计 = 上月加权系数 + 本月加权系数）</b>：官方规则——上月有单已得分、本月才养活的店，本月补差值（如常规P1 上月1.0＋本月0.5＝1.5 拿满），<b>判拿满必须看累计、不能只看本月</b>；达标家数 = 本月系数 &gt; 0 且「是否已记录绩效 = 1」（本期剔除 ${D.meta.perf_drop_total} 家）。单店满分 = 养活档系数（战略 P0 4.5 / P1 3.0，常规 P0 2.5 / P1 1.5；官代+0.5 暂无数据忽略）；<b>「建店未得分商户」= 本月得分=0 + 窗口内 + 绩效已记录（与明细逐户一致）</b>，其可得分按常规 1.3 分/店、战略 3 分/店估算（天花板/120% 倒推同此口径）。<br>
   ③ <b>11月主口径（2611 供给考核方案）</b>：供给考核达成率 =（战略率×战略权重 + 常规率×常规权重 + <b style="color:#b91c1c">养活率×养活权重</b>）× <b>供给份额系数（城市整体值）</b>。权重按城市分层（以 11 月明细「城市分层」字段为准）：反超 40/40/20、对齐 50/30/20、未上岸(落败) 30/50/20；<b>兜底</b>：战略/常规任一项未达 80%，另一项封顶 100%；整体上限 120%。<b>养活是加权求和里的一项（加法），不是 10 月的整体系数（乘法）</b>。<br>
   ④ <b>目标说明（2026-11-07 终版）</b>：城市目标 = <b>11月终版目标表</b>（战略/常规/养活三项，${D.meta.target_ds||'—'}），养活率 = Σ养活系数（常规+战略）÷ 养活商户数目标（官方终版口径）。BD / BDM 目标按考核 BD 人数均分城市目标。<br>
   ⑤ <b>18号建店节点</b>：各城市须在每月 ${D.meta.node18||18} 号前完成建店（签约审核通过），${D.meta.node18||18}-${(D.meta.node18||18)+7} 号集中运营让这批店得分；建店 = 审核通过日，「建店→已得分」为同期群口径。<br>
   ⑥ <b>倒推</b>：天花板 = 池内每户按真实剩余空间（满分−累计得分）补满；新增签约按平均单店（常规 1.3 分、战略 3 分）计入；120%/100% 缺口按新增签约计入常规达成倒推，每拜访 ${D.meta.rules.visits} 家 ≈ 签约 1 家（建议值）。<br>
   ⑦ <b>明细表</b>：单量 = 30 天风控后笔单价 &gt; 5 元有效订单量、营业时长 = 30 天累计 H（均取自 11 月明细，与官方「是否有单」判定 610 家零例外一致）；<b>养活还差单</b> = 养活目标（订单）− 30 天累计单量（与营业时长无关）；<b>「已达标·待养活」</b>= 已拿 1.0 有单基础分（上月+本月累计）、官方未标养活，本月把营业做够养活线即可拿满档位分，是最优先提分对象；<b>「已养活·待补差分」</b>= 上月未养活、本月才养活的店：1.0 基础分已到账，官方已标养活，养活档差分（如常规P1 差 0.5）由系统按「养活档分−上月已得」补发，无需人工动作（上月就已养活的店拿不到差值分，已从池中剔除）；<b>「已达标·待记分」</b>为兜底状态（官方分与达标同步下发，正常应为 0 家）。`;
</script>
