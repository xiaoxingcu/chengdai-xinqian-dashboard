<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新签达成 · 全链路盯盘看板</title>
<style>
:root{
  --bg:#f5f7fa; --card:#ffffff; --ink:#0f172a; --sub:#64748b; --line:#e2e8f0;
  --blue:#2563eb; --teal:#0f766e; --red:#b91c1c; --orange:#c2410c; --purple:#6d28d9;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;padding:22px 26px 40px}
.header{max-width:1460px;margin:0 auto 18px}
h1{font-size:25px;font-weight:800;letter-spacing:.5px}
.badges{margin-top:8px;display:flex;gap:10px;flex-wrap:wrap}
.badge{background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 14px;font-size:12.5px;color:var(--sub)}
.badge b{color:var(--ink)}
.note{margin-top:8px;font-size:12.5px;color:var(--sub);line-height:1.7}
.note b{color:#334155}
.kpis{max-width:1460px;margin:0 auto 18px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kpi .t{font-size:13px;color:var(--sub);margin-bottom:6px}
.kpi .v{font-size:30px;font-weight:800;line-height:1.1}
.kpi .s{font-size:12px;color:var(--sub);margin-top:5px}
.sec{max-width:1460px;margin:0 auto 20px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
.sec-h .n{font-size:17px;font-weight:800;padding:3px 12px;border-radius:8px;color:#fff}
.sec-h .d{font-size:12.5px;color:var(--sub)}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,.06)}
th{background:#f1f5f9;font-size:12.5px;color:#475569;font-weight:700;padding:10px 10px;text-align:center;white-space:nowrap;position:sticky;top:0;z-index:2}
td{padding:9px 10px;text-align:center;font-size:13.5px;border-top:1px solid #eef2f7;white-space:nowrap}
td.l{text-align:left}
.city-cell{font-weight:700;font-size:14.5px}
.pill{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12.5px;font-weight:700}
.pill.good{background:#dcfce7;color:#166534}
.pill.mid{background:#fef9c3;color:#854d0e}
.pill.bad{background:#fee2e2;color:#991b1b}
.pill.gray{background:#f1f5f9;color:#475569}
.judge{font-size:12.5px;font-weight:700}
.jj-green{color:#15803d}.jj-red{color:#b91c1c}.jj-orange{color:#c2410c}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.fbtn{border:1px solid var(--line);background:#fff;border-radius:18px;padding:5px 14px;font-size:12.5px;cursor:pointer;color:#334155}
.fbtn.on{background:#2563eb;color:#fff;border-color:#2563eb}
.fcount{font-size:12px;color:var(--sub)}
.search{border:1px solid var(--line);border-radius:18px;padding:5px 14px;font-size:12.5px;width:200px;outline:none}
.twrap{max-height:640px;overflow:auto;border-radius:12px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.tag{display:inline-block;padding:1px 7px;border-radius:8px;font-size:11px;font-weight:700;margin-left:4px;vertical-align:1px}
.tag.zl{background:#f3e8ff;color:#6d28d9}
.tag.cg{background:#e0f2fe;color:#0369a1}
.tag.cm{background:#f5f3ff;color:#7c3aed}
.tag.lk{background:#e0f2fe;color:#0369a1}
.tag.wait{background:#f1f5f9;color:#64748b;font-weight:600}
.footer{max-width:1460px;margin:26px auto 0;font-size:12px;color:#94a3b8;line-height:1.9;border-top:1px solid var(--line);padding-top:12px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}}
/* ===== 手机端适配（2026-11-07）===== */
@media(max-width:768px){
  body{padding:10px 8px 30px;font-size:13px}
  h1{font-size:19px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:8px}
  .card{padding:10px;border-radius:10px}
  table{font-size:12px}
  th,td{padding:4px 6px}
  /* 大表：横向平滑滚动 + 表头/首列吸附 */
  #cityTable,#dailyTable,#rtTable{overflow-x:auto;-webkit-overflow-scrolling:touch}
  #cityTable table,#dailyTable table{min-width:980px}
  #rtTable{min-width:820px}
  #dailyTable th{position:sticky;top:0;z-index:3;background:#f8fafc}
  #dailyTable td:first-child,#dailyTable th:first-child{position:sticky;left:0;z-index:2;background:#f8fafc}
  #dailyTable thead th:first-child{z-index:4}
  .filters{flex-wrap:wrap;gap:6px}
  .badge{display:inline-block;margin:2px 4px 2px 0}
}
</style>
</head>

    {t:'天花板（未得分全得分）', v:pct(t.mx), s:'窗口内建店未得分全部按基础分计入后', c:cls(t.mx)},

    {t:'未得分缺口单量', v:ind.reduce((a,c)=>a+c.need_orders,0)+' 单', s:SNAP?('按 '+D.meta.score_ds+' 明细，池内还差这么多单'):('今日实时已产 '+ind.reduce((a,c)=>a+c.today_orders,0)+' 单'), c:'jj-orange'},

// 城市表 —— 排序：①按城市体量（组合计常规目标）降序；②常德三小城一组，合计行放组内最后
(function(){
  const CD = ['武陵区','鼎城区','津市','常德其他'];
  const grp = c => (c.sum_row || CD.includes(c.c)) ? '常德' : c.c;
  const grpRt = {};
  D.cities.forEach(c=>{ if(!c.sum_row){ const g=grp(c); grpRt[g]=(grpRt[g]||0)+c.rt; } });
  const order = Object.entries(grpRt).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const cs = [...D.cities].sort((a,b)=>{
    const ga=order.indexOf(grp(a)), gb=order.indexOf(grp(b));
    if(ga!==gb) return ga-gb;
    if(a.sum_row) return 1;
    if(b.sum_row) return -1;
    return b.rt-a.rt;   // 组内按常规目标（体量）降序
  });
  const rankMap = {}; D.cities.forEach(c=>{ if(c.rank) rankMap[c.c]=c.rank+' '+c.rank_pct; });
  // 过程项子项单元格：达成率 + 分子/分母 + 距达标差几家
  const procCell = (rate, num, den, need, th) => {
    if(rate==null) return '<span style="color:#94a3b8">—</span>';
    const ok = rate >= th;
    const tail = (need!=null && need>0)
      ? `<b style="color:var(--red)">差 ${need} 家</b>`
      : '<b style="color:#15803d">已达标</b>';
    return `<span class="pill ${ok?'good':'bad'}" style="font-size:12.5px">${pct(rate)}</span>
      <div style="font-size:10.5px;color:var(--sub);margin-top:3px">${num}/${den} 家 · ${tail}</div>`;
  };
  // 权重取分层：TIER_WEIGHTS = (战略, 常规, 养活) —— 索引 0=战略 1=常规 2=养活
  const wOf = (tier, idx) => (tier && D.meta.nov11.weights[tier]) ? Math.round(D.meta.nov11.weights[tier][idx] * 100) : 0;
  let h = `<table><thead><tr>
    <th>城市</th>
    <th>常规得分/目标</th>
    <th>战略得分/目标</th>
    <th>养活达成/目标</th>
    <th>供给份额系数<br><span style="font-weight:400">提升值</span></th>
    <th style="background:#f0fdf4">新签综合完成率<br><span style="font-weight:400">11月主口径</span></th>
    <th>建店未得分商户<br><span style="font-weight:400">常规/战略</span></th>
    <th>天花板<br><span style="font-weight:400">未得分全得分·均分1/2</span></th>
    <th>120%还需签约</th>
    <th>建议还需拜访</th>
    </tr></thead><tbody>`;
  for(const c of cs){
    const has = c.cur!=null;
    const judge = !has ? '<span class="judge jj-orange">无新签考核目标</span>'
      : c.fin==null ? '<span class="judge jj-orange">待养活目标</span>'
      : c.fin>=1.2 ? '<span class="judge jj-green">✓ 已达120%</span>'
      : c.fin>=1 ? '<span class="judge jj-green">✓ 已过100%</span>'
      : (c.ceiling!=null && c.ceiling>=1) ? '<span class="judge jj-green">催单可过100%</span>'
      : (c.need_120==null ? '<span class="judge jj-red">120%不可达·受80%封顶</span>'
         : `<span class="judge jj-red">需签约 ${c.need_120} 家</span>`);
    const TC = {'反超':['#0f766e','#f0fdf4'],'对齐':['#1d4ed8','#eff6ff'],'未上岸':['#b45309','#fffbeb'],'落败':['#b45309','#fffbeb']};
    const tw = c.tier ? (D.meta.nov11.weights[c.tier]||[]).map(w=>Math.round(w*100)).join('/') : '';
    const tierTag = c.tier
      ? `<span class="tag" style="background:${TC[c.tier]?TC[c.tier][1]:'#f1f5f9'};color:${TC[c.tier]?TC[c.tier][0]:'#475569'};border:1px solid ${TC[c.tier]?TC[c.tier][0]:'#cbd5e1'};font-weight:800;font-size:11px">${c.tier}</span>`
      : '';
    const nameCell = c.sum_row
      ? `<span style="color:var(--purple);font-weight:800">常德 · 三区合计</span><div style="font-size:10.5px;color:var(--sub);margin-top:2px">武陵区＋鼎城区＋津市</div>`
      : `<b>${c.c}</b><div style="margin-top:3px">${tierTag}${tw?`<span style="font-size:10px;color:var(--sub);margin-left:4px">${tw}</span>`:''}</div>`;
    const b = v => c.sum_row ? `<span style="color:var(--purple);font-weight:800">${v}</span>` : v;
    const rowBg = c.sum_row ? 'style="background:#faf5ff"' : '';
    const wrW = wOf(c.tier, 1);
    const rtCell = c.rt
      ? `<b style="font-size:14px">${c.ra.toFixed(1)}/${c.rt.toFixed(1)}</b>
         <div style="font-size:10px;color:var(--sub);margin-top:2px">达成率 ${pct(c.ra/c.rt)}</div>`
      : '—';
    const wsW = wOf(c.tier, 0);
    const stCell = c.st
      ? `<b style="font-size:14px">${c.sa.toFixed(1)}/${c.st.toFixed(1)}</b>
         <div style="font-size:10px;color:var(--sub);margin-top:2px">达成率 ${pct(c.sa/c.st)}</div>`
      : '—';
    const wyW = wOf(c.tier, 2);
    const yc = c.yh_calc;
    const yhCell = (yc && (yc.a > 0 || yc.t > 0))
      ? `<b style="font-size:14px;color:#0f766e">${(yc.a||0).toFixed(1)}/${(yc.t||0).toFixed(1)} 分</b>
         <div style="font-size:10px;color:var(--sub);margin-top:2px">达成率 ${yc.t>0?pct(yc.a/yc.t):'—'} · 目标=11月初版养活加权目标</div>`
      : '<span style="color:#94a3b8">—</span>';
    const shareCell = c.share!=null
      ? `<b style="font-size:14px">${c.share.toFixed(3)}</b><div style="font-size:10px;color:var(--sub);margin-top:2px">${c.share_improve||''}</div>`
      : '—';
    const novCell = c.cur_nov!=null
      ? `<span class="pill ${cls(c.cur_nov)}" style="font-weight:800;font-size:15px">${pct(c.cur_nov)}</span>
         <div style="font-size:10px;color:var(--sub);margin-top:3px">${c.rank||''} ${c.rank_pct||''}</div>
         <div style="font-size:10.5px;margin-top:2px">${judge}</div>`
      : (has ? '<span style="color:#94a3b8;font-size:11px">待养活目标</span>' : '—');
    const poolCell = (c.n_r!=null)
      ? `<b style="font-size:13px">常规 ${c.n_r} · 战略 ${c.n_s}</b><div style="font-size:10px;color:var(--sub);margin-top:2px">合计 ${c.n_r+c.n_s} 家</div>`
      : '—';
    const ceilCell = c.ceiling!=null
      ? `<span class="pill ${cls(c.ceiling)}" style="font-weight:800;font-size:14px">${pct(c.ceiling)}</span>`
      : '—';
    const n120 = c.need_120;
    const x120Cell = n120==null
      ? `<span style="color:#b91c1c;font-weight:700;font-size:12px">不可达</span><div style="font-size:10px;color:var(--sub);margin-top:2px">受 80% 封顶限制</div>`
      : (n120===0 ? `<b style="color:#15803d;font-size:15px">0</b><div style="font-size:10px;color:var(--sub);margin-top:2px">已可达120%</div>`
         : `<b style="color:var(--red);font-size:15px">常规 ${c.need_120_r} · 战略 ${c.need_120_s}</b> 家<div style="font-size:10px;color:var(--sub);margin-top:2px">合计 ${n120} 家 · 两项同步达 ${c.need_rate??'—'}% · 剩 ${c.remain_days} 天 · 每天建店 ${c.per_day} 家</div>`);
    const v120Cell = n120==null
      ? '—'
      : (n120===0 ? '0' : `<b style="font-size:14px">${c.visits_120}</b> 家<div style="font-size:10px;color:var(--sub);margin-top:2px">剩 ${c.remain_days} 天 · 每天拜访约 ${Math.ceil(c.visits_120/(c.remain_days||15))} 家</div>`);
    h += `<tr ${rowBg}>
      <td class="l city-cell">${nameCell}</td>
      <td>${b(rtCell)}</td>
      <td>${b(stCell)}</td>
      <td>${b(yhCell)}</td>
      <td>${b(shareCell)}</td>
      <td>${novCell}</td>
      <td>${b(poolCell)}</td>
      <td>${b(ceilCell)}</td>
      <td>${b(x120Cell)}</td>
      <td>${b(v120Cell)}</td></tr>`;
  }
  h += '</tbody></table>';
  document.getElementById('cityTable').innerHTML = h;
})();

// 得分 · 建店 日维度（城市 / BDM / BD）—— 表头与「城市达成·预测·倒推」板块一致

  }
  const N18 = m.node18 || 18;
  const days = DL.days.slice().sort((a,b)=>b-a);          // 日期列倒序：新→旧
  const month = DL.month || '';
  const mm = month.slice(4,6), yy = month.slice(0,4);
  let mode = 'b';   // b=建店 s=得分
  let fCity = '全部', fBdm = '全部';
  const CD = ['武陵区','鼎城区','津市','常德其他'];
  const cityNames = Object.keys(DL.cities).sort((a,b)=>{
    const ga = CD.includes(a)?1:0, gb = CD.includes(b)?1:0;
    if(ga!==gb) return ga-gb;
    return (DL.cities[b].tot.b||0)-(DL.cities[a].tot.b||0);
  });
  const cityRow = cn => (D.cities||[]).find(x=>x.c===cn && !x.sum_row) || (D.cities||[]).find(x=>x.c===cn) || {};
  const WT = tier => (tier && m.nov11.weights[tier]) ? m.nov11.weights[tier] : [0.5,0.3,0.2];
  // 11月加权达成率（与后端 nov11_rate 同一算法：缺养活项按有效权重归一化、80%兜底封顶、份额后整体上限120%）
  function novRate(ra, rt, sa, st, tier, share){
    const w = WT(tier);
    let r = rt ? ra/rt : null, s = st ? sa/st : null;
    if(r!=null && r<0.8 && s!=null) s = Math.min(s,1);
    if(s!=null && s<0.8 && r!=null) r = Math.min(r,1);
    const it = [];
    if(r!=null) it.push([r, w[1]]);
    if(s!=null) it.push([s, w[0]]);
    if(!it.length) return null;
    const tw = it.reduce((a,x)=>a+x[1],0) || 1;
    return Math.min(it.reduce((a,x)=>a+x[0]*x[1],0)/tw * (share||1), 1.2);
  }
  const pctf = v => (v==null ? '—' : (v*100).toFixed(1)+'%');

            ${nd.b?`<div style="font-size:9.5px;color:var(--sub);margin-top:1px">战P0 ${nd.s0||0}·P1 ${nd.s1||0}｜常P0 ${nd.c0||0}·P1 ${nd.c1||0}</div>`:''}</td>
          <td><b style="color:${nd.sr?'#15803d':'#94a3b8'}">${nd.sr}</b> / <b style="color:${nd.ss?'#7c3aed':'#cbd5e1'}">${nd.ss}</b></td>
          <td style="background:#ecfdf5">${preB} / <b style="color:#15803d">${preS}</b></td>
          <td style="background:#fff7ed">${postB} / <b style="color:#c2410c">${postS}</b></td>
          ${days.map(d=>{
            const v = (nd.days[d]||[])[mode==='b'?0:1]||0;
            return `<td style="${d===N18?'border-left:2px dashed #b91c1c;':''}${v?'':'color:#e2e8f0'}${mode==='s'&&v?'color:#15803d;font-weight:700;':''}">${fmt(v)}</td>`;
          }).join('')}
        </tr>`;
      }
    }
    h += '</tbody></table>';
    document.getElementById('dailyTable').innerHTML = h;
  }
  document.getElementById('dailyToggle').innerHTML =
    [['b','建店'],['s','得分']].map(([k,lb])=>
      `<button class="fbtn ${k===mode?'on':''}" data-m="${k}">${lb}</button>`).join('');
  document.getElementById('dailyToggle').addEventListener('click', e=>{
    const b = e.target.closest('.fbtn'); if(!b) return;
    mode = b.dataset.m;
    document.querySelectorAll('#dailyToggle .fbtn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); render();
  });
  const SELST = 'font:12px/1 system-ui;padding:4px 6px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:#0f172a;max-width:130px';
  const bdmNames = cn => cn==='全部'
    ? [...new Set(Object.values(DL.cities).flatMap(c=>Object.keys(c.bdms)))]
    : Object.keys(DL.cities[cn].bdms);
  function drawFilters(){
    document.getElementById('dailyFilters').innerHTML =
      `<select id="dSelCity" style="${SELST}">${['全部',...cityNames].map(v=>`<option ${v===fCity?'selected':''}>${v}</option>`).join('')}</select>`+
      `<select id="dSelBdm" style="${SELST}">${['全部',...bdmNames(fCity)].map(v=>`<option ${v===fBdm?'selected':''}>${v}</option>`).join('')}</select>`+
      `<button id="btnExportDaily" style="${BTN_EXP}">⬇ 导出日维度</button>`;
  }
  drawFilters();
  document.getElementById('dailyFilters').addEventListener('click', e=>{
    if(e.target.id==='btnExportDaily')
      exportTable('#dailyTable table', `得分建店日维度_${DSTAMP}.csv`);
  });
  document.getElementById('dailyFilters').addEventListener('change', e=>{
    if(e.target.id==='dSelCity'){
      fCity = e.target.value;
      if(fCity!=='全部' && fBdm!=='全部' && !bdmNames(fCity).includes(fBdm)) fBdm = '全部';
      drawFilters(); render();
    } else if(e.target.id==='dSelBdm'){
      fBdm = e.target.value; render();
    }
  });
  render();
})();

// footer
document.getElementById('footer').innerHTML =
  `<b>口径说明（取数与计算方式）· 11 月版</b><br>
   ① <b>数据源</b>：全部取自 <b>11 月新签商户明细</b>（${D.meta.nov_src||'—'}，数据日 ${D.meta.score_ds}，${D.meta.pool_count} 家未得满分商户）。<b>不再使用 10 月商户粒度快照</b>。JBP 结果中仍缺的部分（过程项系数 k1/k2 等）留空，出数后补齐。<br>
   ② <b>单店得分（累计 = 上月加权系数 + 本月加权系数）</b>：官方规则——上月有单已得分、本月才养活的店，本月补差值（如常规P1 上月1.0＋本月0.5＝1.5 拿满），<b>判拿满必须看累计、不能只看本月</b>；达标家数 = 本月系数 &gt; 0 且「是否已记录绩效 = 1」（本期剔除 ${D.meta.perf_drop_total} 家）。单店满分 = 养活档系数（战略 P0 4.5 / P1 3.0，常规 P0 2.5 / P1 1.5；官代+0.5 暂无数据忽略）；<b>累计得分未拿满的店都进「未得满分池」</b>。<br>
   ③ <b>11月主口径（2611 供给考核方案）</b>：供给考核达成率 =（战略率×战略权重 + 常规率×常规权重 + <b style="color:#b91c1c">养活率×养活权重</b>）× <b>供给份额系数（城市整体值）</b>。权重按城市分层（以 11 月明细「城市分层」字段为准）：反超 40/40/20、对齐 50/30/20、未上岸(落败) 30/50/20；<b>兜底</b>：战略/常规任一项未达 80%，另一项封顶 100%；整体上限 120%。<b>养活是加权求和里的一项（加法），不是 10 月的整体系数（乘法）</b>。<br>
   ④ <b>目标说明（2026-11-04 更新）</b>：城市目标 = <b>11月初版目标表</b>（战略/常规/养活三项<b>加权分目标</b>，${D.meta.target_ds||'—'}），养活率 = 自算养活得分 ÷ 养活加权目标；<b style="color:#b45309">最终目标下发后替换</b>。无目标城市养活项缺项时权重按有效项归一化，不会稀释达成率。BD / BDM 目标暂设 <b>常规 20 家、战略 8 家</b>（正式目标下发后替换）。<br>
   ⑤ <b>18号建店节点</b>：各城市须在每月 ${D.meta.node18||18} 号前完成建店（签约审核通过），${D.meta.node18||18}-${(D.meta.node18||18)+7} 号集中运营让这批店得分；建店 = 审核通过日，「建店→已得分」为同期群口径。<br>
   ⑥ <b>倒推</b>：天花板 = 窗口内建店未得分商户全部按基础分（常规 1.3 分、战略 3 分，2026-11-05 定版）计入；120%/100% 缺口按新增签约计入常规达成倒推，每拜访 ${D.meta.rules.visits} 家 ≈ 签约 1 家（建议值）。<br>
   ⑦ <b>明细表</b>：单量 = 30 天风控后笔单价 &gt; 5 元有效订单量、营业时长 = 30 天累计 H（均取自 11 月明细，与官方「是否有单」判定 610 家零例外一致）；<b>养活还差单</b> = 养活目标（订单）− 30 天累计单量（与营业时长无关）；<b>「已达标·待养活」</b>= 已拿 1.0 有单基础分（上月+本月累计）、官方未标养活，本月把营业做够养活线即可拿满档位分，是最优先提分对象；<b>「已养活·待补差分」</b>= 上月未养活、本月才养活的店：1.0 基础分已到账，官方已标养活，养活档差分（如常规P1 差 0.5）由系统按「养活档分−上月已得」补发，无需人工动作（上月就已养活的店拿不到差值分，已从池中剔除）；<b>「已达标·待记分」</b>为兜底状态（官方分与达标同步下发，正常应为 0 家）。`;
</script>
